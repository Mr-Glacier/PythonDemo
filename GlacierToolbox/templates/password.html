<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全密码生成器</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* 动态渐变背景 */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(270deg, #0d1b52, #3c145a, #009688, #2196f3, #673ab7, #0d1b52);
            background-size: 200% 200%;
            animation: gradientFlow 30s ease infinite;
            backdrop-filter: blur(18px);
            z-index: -1;
        }

        @keyframes gradientFlow {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            padding-top: 5vh;
        }

        /* 固定不浮动的半透明容器 */
        .card {
            background: rgba(0, 0, 0, 0.45);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            color: #fff;
            max-width: 500px;
            width: 100%;
            padding-bottom: 20px;
            backdrop-filter: blur(8px);
        }

        .card-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 按钮组 */
        .btn-group {
            border-radius: 10px !important;
            overflow: hidden;
        }

        .btn-outline-secondary, .btn-outline-primary {
            border-width: 2px; /* 边框加粗 */
            border-color: rgba(255, 255, 255, 0.5);
            color: #fff;
        }

        .btn-outline-secondary.active, .btn-outline-primary.active {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            border-color: transparent;
            box-shadow: 0 2px 12px rgba(79, 172, 254, 0.4);
        }

        /* 滑块 */
        .form-range::-webkit-slider-thumb {
            width: 20px;
            height: 20px;
            background: #4facfe;
            border: none;
        }

        .form-range::-webkit-slider-runnable-track {
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        /* 密码框 */
        .password-output {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 12px 15px;
            min-height: 60px;
            font-weight: 500;
            font-size: 1.1rem;
            letter-spacing: 1px;
            margin-bottom: 20px;
            user-select: text;
            cursor: text;
            transition: all 0.3s ease;
        }

        .password-output:focus, .password-output:active {
            box-shadow: 0 0 0 2px rgba(79, 172, 254, 0.5);
        }

        /* 提示框 */
        .alert-custom {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.4s ease;
            background: rgba(40, 167, 69, 0.9);
            border-radius: 50px;
            padding: 10px 25px;
        }

        .alert-show {
            opacity: 1 !important;
        }

        @media (max-width: 576px) {
            body {
                padding-top: 10px;
            }

            .card {
                border-radius: 15px;
            }

            .password-output {
                font-size: 1rem;
                min-height: 50px;
            }
        }
    </style>
</head>
<body>

<div class="card p-3 mx-2">
    <div class="card-header pb-0 bg-transparent">
        <label class="form-label fw-bold">选择密码类型</label>
        <div class="btn-group w-100 mb-3">
            <button class="btn btn-outline-secondary active" data-type="random"><i class="bi bi-shuffle"></i> 随机
            </button>
            <button class="btn btn-outline-secondary" data-type="memorable"><i class="bi bi-lightbulb"></i> 易记
            </button>
            <button class="btn btn-outline-secondary" data-type="pin"><i class="bi bi-hash"></i> PIN码</button>
        </div>
    </div>

    <div class="card-body">
        <label for="length" class="form-label">长度: <span id="length-value">20</span></label>
        <input type="range" class="form-range mb-3" id="length" min="4" max="50" value="20">

        <div id="options-container">
            <div class="form-check form-switch mb-2">
                <input class="form-check-input" type="checkbox" id="numbers" checked>
                <label class="form-check-label" for="numbers">包含数字</label>
            </div>
            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="symbols">
                <label class="form-check-label" for="symbols">包含符号</label>
            </div>
        </div>

        <label class="form-label fw-bold">生成的密码</label>
        <div class="password-output" id="generated-password"></div>
    </div>

    <div class="card-footer d-flex gap-2 bg-transparent">
        <button class="btn btn-primary flex-fill py-2" id="copyBtn"><i class="bi bi-clipboard"></i> 复制</button>
        <button class="btn btn-outline-primary flex-fill py-2" id="refreshBtn"><i class="bi bi-arrow-clockwise"></i> 生成
        </button>
    </div>
</div>

<div class="alert alert-success text-center alert-custom" id="copy-alert" role="alert">
    <i class="bi bi-check-circle-fill me-2"></i>密码已复制
</div>

<script>
    const passwordDisplay = document.getElementById('generated-password');
    const lengthSlider = document.getElementById('length');
    const lengthValue = document.getElementById('length-value');
    const useNumbers = document.getElementById('numbers');
    const useSymbols = document.getElementById('symbols');
    const optionsContainer = document.getElementById('options-container');
    const alertBox = document.getElementById('copy-alert');
    let currentType = "random";

    const CHAR_SETS = {
        lowercase: 'abcdefghijklmnopqrstuvwxyz',
        uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
        numbers: '0123456789',
        symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
    };
    const MEMORABLE_WORDS = [
        "apple", "moon", "star", "river", "cloud", "wind", "tree", "light",
        "sky", "stone", "ocean", "fire", "leaf", "wolf", "rain", "dream",
        "snow", "sun", "grass", "bird", "mountain", "lake", "night", "storm",
        "shadow", "flower", "water", "rock", "sand", "forest", "hill", "beach"
    ];

    function capitalizeWord(word) {
        return word.charAt(0).toUpperCase() + word.slice(1);
    }

    function generatePassword() {
        const length = parseInt(lengthSlider.value);
        let password = "";

        switch (currentType) {
            case "random": {
                let chars = CHAR_SETS.lowercase + CHAR_SETS.uppercase;
                if (useNumbers.checked) chars += CHAR_SETS.numbers;
                if (useSymbols.checked) chars += CHAR_SETS.symbols;
                const cryptoArray = new Uint32Array(length);
                window.crypto.getRandomValues(cryptoArray);
                for (let i = 0; i < length; i++) {
                    password += chars[cryptoArray[i] % chars.length];
                }
                break;
            }
            case "memorable": {
                let chosenWords = [];
                for (let i = 0; i < 3; i++) {
                    chosenWords.push(capitalizeWord(MEMORABLE_WORDS[Math.floor(Math.random() * MEMORABLE_WORDS.length)]));
                }
                password = chosenWords.join("-");
                if (useNumbers.checked) password += Math.floor(Math.random() * 100);
                break;
            }
            case "pin": {
                const cryptoArray = new Uint32Array(length);
                window.crypto.getRandomValues(cryptoArray);
                for (let i = 0; i < length; i++) {
                    password += cryptoArray[i] % 10;
                }
                break;
            }
        }
        password = password.substring(0, length);
        passwordDisplay.textContent = password;
    }

    function copyPassword() {
        if (!passwordDisplay.textContent) return;
        navigator.clipboard.writeText(passwordDisplay.textContent).then(() => {
            alertBox.classList.add("alert-show");
            setTimeout(() => alertBox.classList.remove("alert-show"), 1200);
        });
    }

    document.querySelectorAll('.btn-group button').forEach(btn => {
        btn.addEventListener('click', function () {
            document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentType = this.getAttribute("data-type");

            if (currentType === 'memorable') {
                optionsContainer.style.display = "none";
            } else if (currentType === 'pin') {
                optionsContainer.style.display = "none";
            } else {
                optionsContainer.style.display = "block";
            }
            generatePassword();
        });
    });

    lengthSlider.addEventListener('input', () => {
        lengthValue.textContent = lengthSlider.value;
        generatePassword();
    });
    useNumbers.addEventListener('change', generatePassword);
    useSymbols.addEventListener('change', generatePassword);
    document.getElementById('copyBtn').addEventListener('click', copyPassword);
    document.getElementById('refreshBtn').addEventListener('click', generatePassword);

    generatePassword();
</script>
</body>
</html>
