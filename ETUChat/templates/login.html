<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Login Page</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body {
            height: 100vh; /* 用视口高度，确保高度准确 */
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #004080, #0066cc, #004080, #0066cc);
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;

            /* 使用 Flexbox 完全居中 */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .login-container {
            background: rgba(255, 255, 255, 0.65);
            border-radius: 1rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            padding: 2.5rem 3rem;
            width: 340px;
            max-width: 90vw;
            text-align: center;
            backdrop-filter: saturate(180%) blur(8px);
            -webkit-backdrop-filter: saturate(180%) blur(8px);
            transition: background 0.3s ease;

            /* 防止容器太高撑破屏幕，且居中更稳 */
            max-height: 90vh;
            overflow-y: auto;
        }

        /* 悬浮时背景变更清晰 */
        .login-container:hover {
            background: rgba(255, 255, 255, 0.8);
        }


        .login-header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.8rem;
            color: #007bff;
            font-weight: 700;
            font-size: 1.8rem;
            user-select: none;
        }

        .login-header img {
            width: 36px;
            height: 36px;
            margin-right: 0.6rem;
            object-fit: contain;
            flex-shrink: 0;
        }

        .form-group label {
            font-weight: 600;
            color: #333;
        }

        .form-control {
            border-radius: 0.5rem;
            border: 1.5px solid #80d0c7;
            transition: border-color 0.3s ease;
        }

        .form-control:focus {
            border-color: #007bff;
            box-shadow: 0 0 6px #007bffaa;
        }

        .btn-primary {
            width: 100%;
            border-radius: 0.6rem;
            background: linear-gradient(45deg, #007bff, #00c6ff);
            border: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: background 0.4s ease;
        }

        .btn-primary:hover {
            background: linear-gradient(45deg, #0056b3, #0093e9);
        }

        .alert-placeholder {
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <!-- 这里替换为你的图片地址 -->
        <img src="your-icon.png" alt="Logo"/>
        ETU
    </div>
    <form id="loginForm" novalidate>
        <div class="alert alert-danger alert-placeholder" role="alert" id="alertMsg"></div>
        <div class="form-group text-left">
            <label for="username">Username</label>
            <input type="text" class="form-control" id="username" required autocomplete="username"/>
        </div>
        <div class="form-group text-left">
            <label for="password">Password</label>
            <input type="password" class="form-control" id="password" required autocomplete="current-password"/>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Login</button>
    </form>
</div>

<!-- Bootstrap JS and dependencies -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script>
    const form = document.getElementById('loginForm');
    const alertMsg = document.getElementById('alertMsg');

    form.addEventListener('submit', function (event) {
        event.preventDefault();

        const username = form.username.value.trim();
        const password = form.password.value;

        alertMsg.style.display = 'none';
        alertMsg.textContent = '';

        if (username.length < 3) {
            alertMsg.textContent = 'Username must be at least 3 characters.';
            alertMsg.style.display = 'block';
            form.username.focus();
            return;
        }
        if (password.length < 6) {
            alertMsg.textContent = 'Password must be at least 6 characters.';
            alertMsg.style.display = 'block';
            form.password.focus();
            return;
        }

        alert(`Logging in with username: ${username}`);
    });
</script>
</body>
</html>
