<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>ETU-Chat - Login</title>
    <!-- Bootstrap CSS -->
    <link href="/static/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="icon" href="/static/ETU.ico" sizes="16x16 32x32 48x48 64x64" type="image/x-icon">
    <style>
        body {
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: linear-gradient(-45deg, #001f3d, #003366, #0074e4, #00aaff, #00ffd1, #a0f0ff),
            radial-gradient(circle at top right, rgba(255, 255, 255, 0.15), transparent 70%),
            radial-gradient(circle at bottom left, rgba(255, 255, 255, 0.1), transparent 60%);
            background-size: 400% 400%, 100% 100%, 100% 100%;
            background-repeat: no-repeat;
            animation: gradientBG 18s ease-in-out infinite;
            filter: brightness(1.05) saturate(1.2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%, 0% 0%, 100% 100%;
            }
            25% {
                background-position: 50% 20%, 10% 10%, 90% 90%;
            }
            50% {
                background-position: 100% 50%, 20% 20%, 80% 80%;
            }
            75% {
                background-position: 50% 80%, 10% 30%, 90% 70%;
            }
            100% {
                background-position: 0% 50%, 0% 0%, 100% 100%;
            }
        }

        .login-container {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 1rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            padding: 3rem 3.5rem;
            width: 400px;
            max-width: 90vw;
            text-align: center;
            backdrop-filter: saturate(180%) blur(8px);
            -webkit-backdrop-filter: saturate(180%) blur(8px);
            transition: background 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        @media (max-width: 600px) {
            .login-container {
                width: 90vw;
                padding: 2rem;
            }

            .login-header {
                flex-direction: column;
                align-items: center;
            }

            .login-header img {
                height: 40px;
            }

            .form-row label {
                min-width: auto;
                margin-bottom: 0.5rem;
            }
        }

        .login-container:hover {
            background: rgba(255, 255, 255, 0.8);
        }

        .login-header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.8rem;
            color: #007bff;
            font-weight: 700;
            font-size: 2rem;
            user-select: none;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
            gap: 0.7rem;
            transition: color 0.3s ease;
        }

        .login-header img {
            width: auto;
            height: 50px;
            object-fit: contain;
            flex-shrink: 0;
            transition: transform 0.3s ease;
            cursor: default;
        }

        .login-header:hover img {
            transform: scale(1.2);
        }

        .login-header:hover {
            color: #004ca4;
        }

        .form-row {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 1rem;
        }

        .alert-placeholder {
            margin-top: 0.5rem;
            margin-bottom: 1rem;
            display: none;
        }

        .btn-primary {
            width: 100%;
            max-width: 200px;
            margin-left: auto;
            margin-right: auto;
            border-radius: 0.6rem;
            background: linear-gradient(45deg, #007bff, #00c6ff);
            border: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: background 0.4s ease;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <!-- 这里替换为你的图片地址 -->
        <img src="/static/images/ETU_Logo.png" alt="Logo"/>
        ETU-Chat
    </div>
    <form id="loginForm" novalidate>
        <div class="alert alert-danger alert-placeholder" role="alert" id="alertMsg"></div>

        <!-- 用户名行 -->
        <div class="form-row align-items-center">
            <label for="username" class="col-auto mb-0 font-weight-bold">账户</label>
            <div class="col">
                <input type="text" class="form-control" id="username" required autocomplete="username"/>
            </div>
        </div>

        <!-- 密码行 -->
        <div class="form-row align-items-center">
            <label for="password" class="col-auto mb-0 font-weight-bold">密码</label>
            <div class="col input-group">
                <input type="password" class="form-control" id="password" required autocomplete="current-password"/>
                <div class="input-group-append">
                    <button class="btn btn-outline-secondary btn-toggle-pass" type="button" tabindex="-1"
                            aria-label="Toggle password visibility">
                        👁️
                    </button>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary mt-3">Login</button>
    </form>
</div>

<!-- Bootstrap JS and dependencies -->
<script src="/static/js/jquery-3.5.1.slim.min.js"></script>
<script src="/static/js/popper.min.js"></script>
<script src="/static/js/bootstrap.min.js"></script>
<script>
    const form = document.getElementById('loginForm');
    const alertMsg = document.getElementById('alertMsg');

    document.querySelector('.btn-toggle-pass').addEventListener('click', function () {
        const pwdInput = document.getElementById('password');
        if (pwdInput.type === 'password') {
            pwdInput.type = 'text';
            this.textContent = '🙈';
        } else {
            pwdInput.type = 'password';
            this.textContent = '👁️';
        }
    });

    form.addEventListener('submit', function (event) {
        event.preventDefault();

        const username = form.username.value.trim();
        const password = form.password.value;

        alertMsg.style.display = 'none';
        alertMsg.textContent = '';

        if (username.length < 3) {
            alertMsg.textContent = '账户必须至少3个字符。';
            alertMsg.style.display = 'block';
            form.username.focus();
            return;
        }
        if (password.length < 6) {
            alertMsg.textContent = '密码必须至少6个字符。';
            alertMsg.style.display = 'block';
            form.password.focus();
            return;
        }

        alert(`Logging in with username: ${username}`);
    });
</script>
</body>
</html>
